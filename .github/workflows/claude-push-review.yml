name: Claude Push Review

'on':
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Run Claude review
        id: claude-review
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          max_turns: "5"
          allowed_tools: "Bash(git:*),View,GlobTool,GrepTool"
          prompt: |
            Review the latest commit in the Fiysam repository.

            Review only the changes introduced by:
            HEAD^..HEAD

            Read CLAUDE.md and any relevant .claude/ rules or skills before reviewing.

            This is a review-only task. Do not modify, create, delete, commit, or push files.

            Report only confirmed findings.

            Focus on:
            - bugs and regressions
            - security issues
            - Next.js/React issues
            - TypeScript problems
            - accessibility issues
            - responsive UI problems
            - performance problems
            - violations of repository conventions

            For every finding, include:
            - severity
            - file
            - line
            - problem
            - recommended fix

            If there are no confirmed findings, respond:
            "No confirmed findings."
            